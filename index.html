<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Bright Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo" href="#/" aria-label="The Bright Files home"><span class="logo-mark">✳</span><span>BRIGHT<b>FILES</b></span></a>

    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">Home</a>
      <div class="menu">
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel">All projects <i>▾</i></button>
        <div class="menu-panel" id="menuPanel" hidden></div>
      </div>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/gallery" data-nav="gallery">Gallery</a>
    </nav>

    <div class="search" id="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="Search projects, formulas, docs…" autocomplete="off" aria-label="Search">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>THE BRIGHT FILES © <span id="year"></span></span>
    <span>Everything I build, in one place.</span>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <div class="lb-body" id="lbBody"></div>
  </div>

  <!-- Chat (visual only) -->
  <button class="chat-fab" id="chatFab" aria-label="Open chat" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
  </button>
  <section class="chat" id="chat" hidden aria-label="Chat">
    <header>
      <span class="orb"></span>
      <div><strong>BRIGHT·AI</strong><small>Assistant preview</small></div>
      <button id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat-log">
      <div class="msg bot">Hi! Ask me anything about the projects.</div>
    </div>
    <form class="chat-form" id="chatForm">
      <input type="text" placeholder="Write a message…" aria-label="Message">
      <button type="submit" aria-label="Send">➤</button>
    </form>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
